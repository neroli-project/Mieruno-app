<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目の前認識AIアシスタント</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
        }
        /* 画面全体をタップエリアにするためのコンテナ */
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            cursor: pointer;
        }
        /* カメラ映像（背景） */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        /* 状態表示用のオーバーレイ */
        #status-overlay {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 30px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            text-align: center;
            pointer-events: none; /* タップをコンテナに通すため */
        }
        #status-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            min-height: 1.8em;
        }
        #sub-text {
            font-size: 0.9rem;
            color: #aaa;
        }
        /* 非表示用のビデオ・キャンバス要素 */
        #snapshot-canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- カメラのプレビュー -->
        <video id="camera-video" autoplay playsinline muted></video>

        <!-- 状態表示 -->
        <div id="status-overlay">
            <div id="status-text">カメラを起動中...</div>
            <div id="sub-text">画面どこでもタップ：一言解説 / 2回タップ：詳細解説</div>
        </div>
    </div>

    <!-- キャプチャ用 -->
    <canvas id="snapshot-canvas"></canvas>

    <script>
        const video = document.getElementById('camera-video');
        const canvas = document.getElementById('snapshot-canvas');
        const statusText = document.getElementById('status-text');
        const appContainer = document.getElementById('app-container');

        let isProcessing = false;
        let tapTimer = null;
        let tapCount = 0;

        // Vercel上のAPIエンドポイント（必要に応じてパスを変更してください）
        const API_ENDPOINT = '/api/analyze'; 

        let hasStarted = false; // 起動時の初回タップ判定用

        // 1. カメラの起動
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    // ここでは音声を出さず、文字だけ表示（自動再生ブロック対策）
                    updateStatus("準備完了。画面をどこでもタップしてください。");
                };
            } catch (err) {
                console.error("カメラの起動に失敗しました:", err);
                updateStatus("カメラの起動に失敗しました。");
            }
        }

        // 5. タップ判定（修正版）
        appContainer.addEventListener('click', (e) => {
            // 【重要】もしまだ一度もスタートしていないなら、最初のタップで音声を解禁する
            if (!hasStarted) {
                hasStarted = true;
                speak("起動しました。周囲を確認します。");
                analyzeScene(false);
                return;
            }

            // ここから下は、2回目以降の通常のシングル・ダブルタップ判定
            tapCount++;
            if (tapCount === 1) {
                tapTimer = setTimeout(() => {
                    if (tapCount === 1) {
                        analyzeScene(false); // 1回タップ：一言解説
                    } else if (tapCount >= 2) {
                        analyzeScene(true);  // 2回タップ：詳細解説
                    }
                    tapCount = 0;
                }, 300);
            }
        });

        // 2. 音声合成（Text-to-Speech）＋ 割り込み制御
        function speak(text) {
            if (!('speechSynthesis' in window)) {
                console.warn("このブラウザは音声合成に対応していません");
                return;
            }
            // 割り込み：現在喋っている音声を即座に停止
            window.speechSynthesis.cancel();

            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            uttr.rate = 1.1; // テンポよく少し早め
            window.speechSynthesis.speak(uttr);
        }

        // 3. 画面のステータス更新
        function updateStatus(text) {
            statusText.textContent = text;
        }

        // 4. 画像をキャプチャしてVercelのAPIへ送信
        async function analyzeScene(isDetail = false) {
            if (isProcessing) return;
            isProcessing = true;

            updateStatus(isDetail ? "詳細を確認中..." : "状況を確認中...");
            if (!isDetail) {
                speak(isDetail ? "詳しく確認します" : "確認しています");
            }

            try {
                // キャンバスに現在のフレームを描画
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Base64形式に変換
                const base64Image = canvas.toDataURL('image/jpeg', 0.8);

                // Vercel APIへのリクエスト
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: base64Image,
                        mode: isDetail ? 'detail' : 'brief'
                    })
                });

                if (!response.ok) {
                    throw new Error('APIサーバーのエラー');
                }

                const data = await response.json();
                const description = data.description || "説明を取得できませんでした。";

                updateStatus(description);
                speak(description);

            } catch (err) {
                console.error("解析エラー:", err);
                const errorMsg = "通信エラーが発生しました。もう一度タップしてください。";
                updateStatus(errorMsg);
                speak(errorMsg);
            } finally {
                isProcessing = false;
            }
        }

        // 5. タップ判定（シングルタップ / ダブルタップの切り分け）
        appContainer.addEventListener('click', (e) => {
            tapCount++;

            if (tapCount === 1) {
                tapTimer = setTimeout(() => {
                    if (tapCount === 1) {
                        // 1回タップ：シングルタップ（一言解説・再読み上げ）
                        // ※すでに喋っている場合は speak() 内の cancel() で止まる
                        analyzeScene(false);
                    } else if (tapCount >= 2) {
                        // 2回以上タップ：ダブルタップ（詳細解説）
                        analyzeScene(true);
                    }
                    tapCount = 0;
                }, 300); // 300ms以内に2回目が来るか判定
            }
        });

        // アプリ起動時の実行
        window.addEventListener('load', () => {
            initCamera();
        });
    </script>
</body>
</html>
